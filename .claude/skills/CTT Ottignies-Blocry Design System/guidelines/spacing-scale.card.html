<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px base — card padding 24, section rhythm 80" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--white); color: var(--text-strong); }
  .wrap { padding: 18px 22px; display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--club-blue); border-radius: 3px; width: 22px; }
  .v { font-size: 10px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .v b { color: var(--text-strong); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="item"><div class="bar" style="height:8px"></div><div class="v"><b>2</b> · 8</div></div>
    <div class="item"><div class="bar" style="height:12px"></div><div class="v"><b>3</b> · 12</div></div>
    <div class="item"><div class="bar" style="height:16px"></div><div class="v"><b>4</b> · 16</div></div>
    <div class="item"><div class="bar" style="height:24px"></div><div class="v"><b>6</b> · 24</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="v"><b>8</b> · 32</div></div>
    <div class="item"><div class="bar" style="height:48px"></div><div class="v"><b>12</b> · 48</div></div>
    <div class="item"><div class="bar" style="height:64px"></div><div class="v"><b>16</b> · 64</div></div>
    <div class="item"><div class="bar" style="height:80px"></div><div class="v"><b>20</b> · 80</div></div>
  </div>
</body>
</html>
