<!-- @dsCard group="Brand" viewport="700x230" name="Imagery" subtitle="Warm sport-action photography under a blue brand wash" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .wrap { position: relative; height: 230px; overflow: hidden; }
  .wrap img { width: 100%; height: 100%; object-fit: cover; }
  .wash { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(30,64,175,.85), rgba(30,64,175,.80) 50%, rgba(59,130,246,.85)); }
  .label { position: absolute; left: 24px; bottom: 20px; color: #fff; }
  .label h3 { margin: 0; font-size: 22px; font-weight: 700; }
  .label p { margin: 4px 0 0; font-size: 12px; opacity: .85; }
  .label .tag { display:inline-block; margin-top:10px; background: var(--club-yellow); color: var(--club-blue); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: var(--radius-md); }
</style>
</head>
<body>
  <div class="wrap">
    <img src="../assets/images/background_home.webp" alt="Table tennis action">
    <div class="wash"></div>
    <div class="label">
      <h3>Full-bleed hero photography</h3>
      <p>Action shots + diagonal blue→blue-light gradient overlay (≈80–85% opacity)</p>
      <span class="tag">Brand wash</span>
    </div>
  </div>
</body>
</html>
