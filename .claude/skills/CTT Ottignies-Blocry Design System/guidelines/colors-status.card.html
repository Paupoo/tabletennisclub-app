<!-- @dsCard group="Colors" viewport="700x150" name="Status & semantic" subtitle="info / success / warning / error from the bumblebee theme" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--white); color: var(--text-strong); }
  .row { display: flex; gap: 14px; padding: 18px; flex-wrap: wrap; }
  .sw { width: 156px; }
  .chip { height: 48px; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; }
  .meta { padding: 7px 2px 0; }
  .name { font-size: 12px; font-weight: 600; }
  .hex { font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--info)">Info</div><div class="meta"><div class="name">Info</div><div class="hex">#3b82f6</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--success)">Success</div><div class="meta"><div class="name">Success</div><div class="hex">emerald</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--warning)">Warning</div><div class="meta"><div class="name">Warning</div><div class="hex">amber</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--error)">Error</div><div class="meta"><div class="name">Error</div><div class="hex">red</div></div></div>
  </div>
</body>
</html>
