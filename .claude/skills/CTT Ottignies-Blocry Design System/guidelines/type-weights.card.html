<!-- @dsCard group="Type" viewport="700x180" name="Weights & eyebrow" subtitle="Instrument Sans 400–700, uppercase tracked eyebrows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--white); color: var(--text-strong); }
  .wrap { padding: 20px 22px; }
  .weights { display: flex; gap: 26px; flex-wrap: wrap; margin-bottom: 18px; }
  .w { font-size: 30px; }
  .w span { display: block; font-size: 10px; color: var(--text-faint); font-weight: 400; margin-top: 2px; }
  .eyebrow { font-size: var(--text-sm); font-weight: 700; letter-spacing: var(--tracking-widest); text-transform: uppercase; color: var(--club-blue); }
  .serif { font-family: var(--font-serif); font-size: 26px; color: var(--text-strong); margin-top: 14px; }
  .serif span { font-family: var(--font-sans); font-size: 10px; color: var(--text-faint); display: block; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="weights">
      <div class="w" style="font-weight:400">Aa<span>Regular 400</span></div>
      <div class="w" style="font-weight:500">Aa<span>Medium 500</span></div>
      <div class="w" style="font-weight:600">Aa<span>Semibold 600</span></div>
      <div class="w" style="font-weight:700">Aa<span>Bold 700</span></div>
    </div>
    <div class="eyebrow">Prochains événements</div>
    <div class="serif">“Le plus beau des sports.”<span>Instrument Serif — editorial accent only</span></div>
  </div>
</body>
</html>
