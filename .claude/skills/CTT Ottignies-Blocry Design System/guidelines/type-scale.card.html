<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="Instrument Sans — hero to caption" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--white); color: var(--text-strong); }
  .wrap { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
  .line { display: flex; align-items: baseline; gap: 14px; }
  .tag { font-size: 10px; color: var(--text-faint); width: 96px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .d  { font-size: var(--text-5xl); font-weight: 700; letter-spacing: var(--tracking-tight); line-height: 1; }
  .h2 { font-size: var(--text-4xl); font-weight: 700; }
  .h3 { font-size: var(--text-xl); font-weight: 600; }
  .lead { font-size: var(--text-xl); font-weight: 400; color: var(--text-body); }
  .body { font-size: var(--text-base); font-weight: 400; color: var(--text-body); }
  .cap { font-size: var(--text-sm); color: var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="line"><span class="tag">Display / 48–72</span><span class="d">CTT Ottignies</span></div>
    <div class="line"><span class="tag">H2 / 36 · 700</span><span class="h2">Pourquoi nous rejoindre&nbsp;?</span></div>
    <div class="line"><span class="tag">H3 / 20 · 600</span><span class="h3">Excellence compétitive</span></div>
    <div class="line"><span class="tag">Lead / 20 · 400</span><span class="lead">Une communauté passionnée de tennis de table.</span></div>
    <div class="line"><span class="tag">Body / 16 · 400</span><span class="body">Des débutants aux champions, tout le monde est le bienvenu au club.</span></div>
    <div class="line"><span class="tag">Caption / 14</span><span class="cap">Publié le 14 juin 2026 · Compétition</span></div>
  </div>
</body>
</html>
