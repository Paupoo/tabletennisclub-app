<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .wrap { display: flex; }
  .panel { flex: 1; height: 200px; display: flex; align-items: center; justify-content: center; gap: 16px; }
  .light { background: var(--white); }
  .blue { background: var(--club-blue); }
  .lock { display: flex; align-items: center; gap: 12px; }
  .lock img { height: 72px; width: auto; }
  .name { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .name small { display: block; font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; opacity: .65; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel light">
      <div class="lock" style="color:var(--club-blue)">
        <img src="../assets/logo-club.svg" alt="CTT Ottignies-Blocry logo">
        <div class="name">CTT Ottignies<small>Blocry</small></div>
      </div>
    </div>
    <div class="panel blue">
      <div class="lock" style="color:#fff">
        <img src="../assets/logo-club.svg" alt="CTT logo white" style="filter:brightness(0) invert(1)">
        <div class="name">CTT Ottignies<small>Blocry</small></div>
      </div>
    </div>
  </div>
</body>
</html>
